<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Marvel information portal"
    />
    <title>Marvel information portal</title>
      <!-- Link previews (LinkedIn, Telegram, Slack, X). The crawler fetches the
         image from its own server, so these URLs have to be absolute: a
         root-relative path gives it no host and the card renders with no image. -->
    <link rel="canonical" href="https://marvel-info-portal-dun.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Leonid Shamarin" />
    <meta property="og:url" content="https://marvel-info-portal-dun.vercel.app/" />
    <meta property="og:title" content="Marvel Information Portal" />
    <meta property="og:description" content="Marvel characters and comics, with detail pages and a random-character panel." />
    <meta property="og:image" content="https://marvel-info-portal-dun.vercel.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marvel Information Portal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marvel Information Portal" />
    <meta name="twitter:description" content="Marvel characters and comics, with detail pages and a random-character panel." />
    <meta name="twitter:image" content="https://marvel-info-portal-dun.vercel.app/og-card.png" />
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
